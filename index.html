<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F4B"><title>Muzipay</title>
<style>
:root{--n:#0B1F4B;--b:#2563FF;--bg:#F2F5FC;--t:#0F1B3D;--m:#6B7794;--ok:#12A150;--er:#D93636;--wr:#C77700;--ln:#E2E8F5}
*{box-sizing:border-box;margin:0;padding:0}button{font:inherit}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0B1F4B,#2148C0);color:var(--t);display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
@media(min-width:700px){#app{margin:16px 0;min-height:calc(100vh - 32px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #0006}}
.pg{padding:16px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:18px}h3{font-size:15px;margin:14px 0 8px}p{margin-bottom:8px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd h2{flex:1}
.ib{background:#fff;border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--n);cursor:pointer;box-shadow:0 1px 4px #0b1f4b14;position:relative}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0b1f4b0d}
.bal{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.bal b{display:block;font-size:30px;margin:2px 0 14px;letter-spacing:-.5px}.row{display:flex;justify-content:space-between;align-items:center}
.eye{background:#fff2;border:0;color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.qa4,.sv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sv{margin-bottom:12px}
.qa{background:#ffffff1f;border:0;border-radius:14px;color:#fff;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.sv button{background:#fff;border:0;border-radius:16px;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--n);cursor:pointer;box-shadow:0 2px 10px #0b1f4b0d}
label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;color:var(--t);background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:var(--b);color:#fff;font-weight:600;cursor:pointer;text-align:center;margin-top:6px}
.btn.ghost{background:#EAF0FF;color:var(--b)}.btn.red{background:#FDECEC;color:var(--er)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:#F2F5FC;border-radius:12px;padding:4px 12px;margin:8px 0}.sum:empty{display:none}
.rw{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:14px}.rw:last-child{border:0}.rw span{color:var(--m)}.rw b{text-align:right;word-break:break-all}
.err{color:var(--er);font-size:13px;margin:4px 0}.mu{color:var(--m)}.ok{color:var(--ok)}
.tabs{display:flex;background:#E6ECFA;border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}.tabs button{flex:1;border:0;background:0;padding:9px 4px;border-radius:10px;color:var(--m);font-weight:600;cursor:pointer}.tabs .on{background:#fff;color:var(--b);box-shadow:0 1px 4px #0b1f4b1a}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stg .card{margin:0}.stg small{color:var(--m)}.stg b{display:block;font-size:16px}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.tx:last-child{border:0}.tx>div:nth-child(2){flex:1;min-width:0}
.ti{width:38px;height:38px;border-radius:12px;background:#EAF0FF;color:var(--b);display:grid;place-items:center;flex:none}.ti.in{background:#E4F6EC;color:var(--ok)}.ta{text-align:right}.ta small{display:block}
.bn{overflow:hidden;border-radius:20px}.bt{display:flex;transition:transform .5s ease}.bs{flex:0 0 100%;padding:18px;color:#fff;min-height:128px;cursor:pointer}.bs p{font-size:13px;opacity:.92;margin:4px 0 10px}
.sm{border:0;border-radius:10px;padding:6px 12px;background:#fff;color:var(--b);font-weight:600;cursor:pointer}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0 12px}.dots i{width:6px;height:6px;border-radius:9px;background:#C5D0EA;transition:.3s}.dots .on{width:18px;background:var(--b)}
#nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;display:none;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0b1f4b14;z-index:5}
#nv button{background:0;border:0;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 10px;cursor:pointer}#nv .on{color:var(--b);font-weight:600}
#md{position:fixed;inset:0;background:#0B1F4B99;display:none;align-items:flex-end;justify-content:center;z-index:20}#md.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s}@keyframes up{from{transform:translateY(40px);opacity:0}}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:8px;width:calc(100% - 24px);max-width:420px}
.toast{background:var(--n);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;animation:in .2s}.toast.er{background:var(--er)}
.av{width:42px;height:42px;border-radius:14px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:9px;background:var(--er)}
.auth{padding-top:36px}.lg{text-align:center;color:var(--n);margin-bottom:18px}.lg h1{margin-top:8px}
.skl{border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#e6ebf7 25%,#f3f6fc 50%,#e6ebf7 75%);background-size:200% 100%;animation:sh 1s infinite}@keyframes sh{to{background-position:-200% 0}}
.ch{width:100%;height:auto}.leg{display:flex;gap:12px;font-size:12px;color:var(--m)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.mn{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);cursor:pointer}.mn span{flex:1}
.up{border:1.5px dashed var(--ln);border-radius:14px;padding:10px;margin-bottom:10px}.up img{width:100%;max-height:160px;object-fit:contain;border-radius:10px;margin:8px 0;display:block}
.ck{display:flex;gap:8px;align-items:flex-start}.ck input{width:auto;margin:3px 0 0}
.bd{font-size:12px;padding:3px 10px;border-radius:20px;background:#FFF3DC;color:var(--wr);font-weight:600}
.ok-ic{width:56px;height:56px;border-radius:50%;background:#E4F6EC;color:var(--ok);display:grid;place-items:center;margin:0 auto 8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--ln)}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{font-weight:600;cursor:pointer}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block;padding:24px;font-family:sans-serif}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><div id="v"></div></div>
<nav id="nv" aria-label="Navigasi utama"></nav><div id="md"></div><div id="toasts" aria-live="polite"></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),R=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ={timeZone:'Asia/Jakarta'},fd=t=>new Date(t).toLocaleDateString('id-ID',{...TZ,day:'2-digit',month:'long',year:'numeric'}),
ft=t=>new Date(t).toLocaleTimeString('id-ID',{...TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/\./g,':')+' WIB',
dk=t=>new Date(t).toLocaleDateString('en-CA',TZ),MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const K='muzipay_v1';let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
DB=DB&&DB.accounts?DB:{accounts:{},session:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Penyimpanan perangkat penuh','er')}};
const me=()=>DB.accounts[DB.session],bal=()=>{const a=me();return a.base+a.tx.reduce((s,t)=>s+t.eff,0)};
const hs=(p,s)=>{let x=5381;for(const c of p+s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const ph=v=>{let d=String(v).replace(/[\s-]/g,'');if(d.startsWith('+62'))d='0'+d.slice(3);else if(d.startsWith('62'))d='0'+d.slice(2);return/^08[1-9]\d{7,10}$/.test(d)?d:null};
const NM=/^[A-Za-z .'-]{3,40}$/,E=(o,l)=>{const x=l.find(a=>a[0]);o.err=x?x[1]:0;return o};
const I={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',plus:'M12 5v14M5 12h14',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',cash:'M3 7h18v10H3zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z',hist:'M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5M12 7v5l3 2',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',game:'M6 8h12a4 4 0 014 4v2a3 3 0 01-5 2l-1-2H8l-1 2a3 3 0 01-5-2v-2a4 4 0 014-4zM8 10v4M6 12h4',phone:'M7 2h10v20H7zM11 18h2',bill:'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6',loan:'M12 2v20M17 6H9.5a3 3 0 000 6h5a3 3 0 010 6H7',bell:'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',back:'M15 5l-7 7 7 7',check:'M5 13l4 4L19 7',lock:'M5 11h14v10H5zM8 11V7a4 4 0 018 0v4',info:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v5M12 8v.01',out:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const LOGO='<svg width="64" height="64" viewBox="0 0 64 64" aria-label="Muzipay"><rect width="64" height="64" rx="18" fill="#2563FF"/><path d="M16 44V22l16 14 16-14v22" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TI={'Top Up':'plus',Transfer:'send','Tarik tunai':'cash',Pulsa:'phone','Paket data':'phone','Top Up game':'game','Pembayaran tagihan':'bill',Pinjaman:'loan',Pemasukan:'plus',Pengeluaran:'cash'};
const TYPES=Object.keys(TI),STS=['Tercatat','Menunggu pemeriksaan','Dalam proses','Memerlukan dokumen tambahan','Disetujui','Ditolak'];
function toast(m,k='ok'){const d=document.createElement('div');d.className='toast '+k;d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),2800)}
const modal=h=>{$('#md').innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;$('#md').className='on'},closeM=()=>{$('#md').className='';$('#md').innerHTML=''};
$('#md').addEventListener('click',e=>{if(e.target.id=='md')closeM()});
let cur='home',bt,bi=0,FL,CB,LF={};const P={};
const sk=()=>'<div class="pg"><div class="skl" style="height:56px"></div><div class="skl" style="height:150px"></div><div class="skl" style="height:90px"></div></div>';
function nav(){const n=$('#nv'),M={info:'account',manual:'history'},c=M[cur]||cur;n.style.display=DB.session?'flex':'none';if(DB.session)n.innerHTML=[['home','Beranda','home'],['topup','Top Up','game'],['transfer','Transfer','send'],['history','Riwayat','hist'],['account','Akun','user']].map(x=>`<button class="${c==x[0]?'on':''}" onclick="go('${x[0]}')">${ic(x[2])}<span>${x[1]}</span></button>`).join('')}
function go(p,a){clearInterval(bt);closeM();if(!me())DB.session=null;if(!DB.session)p='auth';cur=p;$('#v').innerHTML=sk();nav();scrollTo(0,0);setTimeout(()=>P[p](a),180)}
const shell=(t,h,b='home')=>`<div class="pg"><div class="hd"><button class="ib" onclick="go('${b}')" aria-label="Kembali">${ic('back')}</button><h2>${t}</h2></div>${h}</div>`;
const tabs=(a,c,f)=>`<div class="tabs">${a.map(x=>`<button class="${x[0]==c?'on':''}" onclick="${f}('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
const rows=a=>a.map(x=>`<div class="rw"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');
/* AUTH */
P.auth=(m='in')=>{$('#v').innerHTML=`<div class="pg auth"><div class="lg">${LOGO}<h1>Muzipay</h1><p class="mu">Dompet digital untuk kebutuhan harianmu</p></div><div class="card">${tabs([['in','Masuk'],['up','Daftar']],m,'P.auth')}<form onsubmit="return auth(event,'${m}')"><label>Nama lengkap<input id="an" autocomplete="name" maxlength="40" required></label><label>Nomor HP<input id="ap" inputmode="tel" placeholder="08xxxxxxxxxx" maxlength="16" required></label>${m=='up'?'<label>Buat PIN transaksi (6 angka)<input id="apin" type="password" inputmode="numeric" maxlength="6" required></label>':''}<div class="err" id="ae"></div><button class="btn">${m=='in'?'Masuk':'Daftar sekarang'}</button></form></div></div>`;nav()};
function auth(e,m){e.preventDefault();const n=$('#an').value.trim().replace(/\s+/g,' '),p=ph($('#ap').value),er=s=>{$('#ae').textContent=s;return false};
if(!NM.test(n))return er('Nama 3–40 huruf, tanpa angka.');if(!p)return er('Nomor HP tidak valid. Contoh: 081234567890');
if(m=='up'){const pin=$('#apin').value;if(!/^\d{6}$/.test(pin))return er('PIN harus 6 angka.');if(DB.accounts[p])return er('Nomor sudah terdaftar. Silakan masuk.');
const id='MP'+Date.now().toString().slice(-8);DB.accounts[p]={id,name:n,phone:p,pin:hs(pin,id),joined:new Date().toISOString(),base:0,tx:[],loans:[],set:{hide:false,notif:true}};toast('Akun berhasil dibuat')}
else{const a=DB.accounts[p];if(!a||a.name.toLowerCase()!=n.toLowerCase())return er('Nama atau nomor HP tidak cocok dengan akun.')}
DB.session=p;save();go('home');return false}
function logout(){modal('<h2>Keluar dari akun?</h2><p class="mu">Data dan saldo tetap tersimpan di perangkat ini.</p><div class="two"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn red" onclick="DB.session=null;save();go(\'auth\')">Keluar</button></div>')}
/* HOME */
const greet=()=>{const h=+new Date().toLocaleString('en-GB',{...TZ,hour:'2-digit',hour12:false});return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
function stats(){const mk=dk(new Date()).slice(0,7);let i=0,o=0,ci=0,co=0,ti=0,to=0;me().tx.forEach(x=>{const v=Math.abs(x.eff),mm=dk(x.ts).slice(0,7)==mk;if(x.eff>0){ti+=v;if(mm){i+=v;ci++}}if(x.eff<0){to+=v;if(mm){o+=v;co++}}});return{i,o,ci,co,ti,to,n:me().tx.length}}
const BN=[{t:'Top Up Game',d:'Pilih game favorit, isi User ID, dan catat pembelian dalam hitungan detik.',c:'linear-gradient(120deg,#2563FF,#5B8CFF)',to:'topup',l:'Buka Top Up'},{t:'Bayar Tagihan',d:'PLN, PDAM, BPJS, internet, dan tagihan lain dalam satu tempat.',c:'linear-gradient(120deg,#0B1F4B,#2563FF)',to:'bills',l:'Bayar Tagihan'},{t:'Pinjaman',d:'Hitung estimasi cicilan dan jadwal pembayaran sebelum mengajukan.',c:'linear-gradient(120deg,#1B3FA8,#4C7DFF)',to:'loan',l:'Hitung Cicilan'}];
const bnGo=i=>go(BN[i].to),bnMore=i=>modal(`<h2>${BN[i].t}</h2><p class="mu">${BN[i].d}</p><button class="btn" onclick="bnGo(${i})">${BN[i].l}</button>`);
function bnShow(i){bi=i;const t=$('#bt');if(!t)return;t.style.transform=`translateX(-${i*100}%)`;BN.forEach((_,k)=>$('#d'+k)&&$('#d'+k).classList.toggle('on',k==i))}
const txi=t=>`<div class="tx" onclick="det('${t.id}')"><div class="ti ${t.eff>0?'in':''}">${ic(TI[t.type]||'hist',18)}</div><div><b>${esc(t.name||t.type)}</b><small class="mu">${fd(t.ts)}, ${ft(t.ts).slice(0,5)}</small></div><div class="ta"><b class="${t.eff>0?'ok':''}">${t.eff?(t.eff>0?'+':'−')+R(Math.abs(t.eff)):R(t.amt)}</b><small class="mu">${esc(t.status)}</small></div></div>`;
P.home=()=>{const a=me(),s=stats(),h=a.set.hide;$('#v').innerHTML=`<div class="pg"><div class="hd"><div class="av">${a.name[0].toUpperCase()}</div><div style="flex:1"><small class="mu">Muzipay · ${greet()}</small><h2>${esc(a.name.split(' ')[0])}</h2></div><button class="ib" onclick="go('notif')" aria-label="Notifikasi">${ic('bell')}${a.tx.length?'<i class="dot"></i>':''}</button></div>
<div class="bal"><div class="row"><small>Total saldo</small><button class="eye" onclick="tog()" aria-label="Tampilkan atau sembunyikan saldo">${ic('eye',18)}</button></div><b>${h?'Rp ••••••':R(bal())}</b><div class="qa4">${[['plus','Tambah saldo','addbal'],['send','Transfer','transfer'],['cash','Tarik tunai','withdraw'],['hist','Riwayat','history']].map(x=>`<button class="qa" onclick="go('${x[2]}')">${ic(x[0])}${x[1]}</button>`).join('')}</div></div>
<div class="sv">${[['game','Top Up Game','topup'],['phone','Pulsa & Data','pulsa'],['bill','Tagihan','bills'],['loan','Pinjaman','loan']].map(x=>`<button onclick="go('${x[2]}')">${ic(x[0])}${x[1]}</button>`).join('')}</div>
<div class="bn"><div class="bt" id="bt">${BN.map((b,i)=>`<div class="bs" style="background:${b.c}" onclick="bnGo(${i})"><h3>${b.t}</h3><p>${b.d}</p><button class="sm" onclick="event.stopPropagation();bnMore(${i})">Selengkapnya</button></div>`).join('')}</div></div><div class="dots">${BN.map((_,i)=>`<i id="d${i}"></i>`).join('')}</div><div id="ad-slot"></div>
<div class="stg"><div class="card"><small>Total pemasukan</small><b class="ok">${R(s.ti)}</b></div><div class="card"><small>Total pengeluaran</small><b>${R(s.to)}</b></div><div class="card"><small>Jumlah transaksi</small><b>${s.n}</b></div><div class="card"><small>Saldo pencatatan</small><b>${h?'••••':R(bal())}</b></div></div>
<div class="row"><h3>Transaksi terakhir</h3><button class="sm" style="background:#EAF0FF" onclick="go('history')">Lihat semua</button></div><div class="card">${a.tx.length?a.tx.slice(0,5).map(txi).join(''):'<p class="mu" style="text-align:center;padding:12px">Belum ada transaksi. Mulai dengan menambah saldo.</p>'}</div></div>`;
bnShow(0);bt=setInterval(()=>bnShow((bi+1)%BN.length),4500);/* Integrasi jaringan iklan resmi: window.MuziPayAds.mount(el) */if(window.MuziPayAds&&window.MuziPayAds.mount)window.MuziPayAds.mount($('#ad-slot'))};
const tog=()=>{me().set.hide=!me().set.hide;save();P.home()};
/* FLOW ENGINE */
function flow(c,el='fl'){FL=c;$('#'+el).innerHTML=`<form class="card" onsubmit="return fsub(event)">${c.fields.map(x=>{const id='f_'+x.k;return`<label id="w_${x.k}">${x.l}${x.o?`<select id="${id}">${x.o.map(o=>{const[l,v]=String(o).split('|');return`<option value="${esc(v??l)}">${esc(l)}</option>`}).join('')}</select>`:`<input id="${id}" type="${x.t=='tel'?'tel':'text'}" ${x.t=='n'?'inputmode="numeric"':''} placeholder="${esc(x.p||'')}" maxlength="${x.m||60}">`}</label>`}).join('')}<div id="sm" class="sum"></div><div class="err" id="fe"></div><button class="btn">Lanjutkan</button></form>`;
c.fields.forEach(x=>['input','change'].forEach(ev=>$('#f_'+x.k).addEventListener(ev,fu)));fu()}
function fv(){const v={};FL.fields.forEach(x=>{const e=$('#f_'+x.k);v[x.k]=x.t=='n'?e.value.replace(/\D/g,''):e.value.trim()});return v}
function fu(){const v=fv();FL.fields.forEach(x=>{const e=$('#f_'+x.k);if(x.t=='n'&&e.value!=v[x.k])e.value=v[x.k];$('#w_'+x.k).style.display=!x.if||x.if(v)?'':'none'});const r=FL.calc(v);$('#sm').innerHTML=r.rows?rows(r.rows):''}

/* ACCOUNT */
function mon(){const n=new Date(),r=[];for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);r.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:MN[d.getMonth()],i:0,o:0,n:0})}me().tx.forEach(t=>{const m=r.find(x=>x.k==dk(t.ts).slice(0,7));if(m){m.n++;if(t.eff>0)m.i+=t.eff;if(t.eff<0)m.o-=t.eff}});return r}
function chart(r,ks,cs,ln){const W=340,H=120,g=W/12,mx=Math.max(1,...r.flatMap(x=>ks.map(k=>x[k]))),w=ks.length>1?9:14;let s=`<svg viewBox="0 0 ${W} ${H+16}" class="ch" role="img" aria-label="Grafik 12 bulan">`;
if(ln)s+=`<polyline fill="none" stroke="${cs[0]}" stroke-width="2.5" points="${r.map((x,i)=>`${i*g+g/2},${H-x.n/mx*H}`).join(' ')}"/>`+r.map((x,i)=>`<circle cx="${i*g+g/2}" cy="${H-x.n/mx*H}" r="3" fill="${cs[0]}"/>`).join('');
r.forEach((x,i)=>{if(!ln)ks.forEach((k,j)=>{const h=x[k]/mx*H;s+=`<rect x="${i*g+(g-w*ks.length)/2+j*w}" y="${H-h}" width="${w-1}" height="${x[k]?Math.max(h,2):0}" rx="2" fill="${cs[j]}"/>`});s+=`<text x="${i*g+g/2}" y="${H+12}" font-size="8" text-anchor="middle" fill="#6B7794">${x.l}</text>`});return s+'</svg>'}
P.account=()=>{const a=me(),s=stats(),r=mon();$('#v').innerHTML=`<div class="pg"><div class="card" style="text-align:center"><div class="av" style="width:64px;height:64px;font-size:26px;margin:0 auto 8px">${a.name[0].toUpperCase()}</div><h2>${esc(a.name)}</h2><small class="mu">${a.phone}</small><div class="sum" style="text-align:left">${rows([['ID pengguna',a.id],['Terdaftar',fd(a.joined)],['Status akun','Aktif']])}</div></div>
<h3>Ringkasan Keuangan Bulanan</h3><div class="stg">${[['Uang masuk bulan ini',R(s.i)],['Uang keluar bulan ini',R(s.o)],['Saldo akhir bulan',R(bal())],['Transaksi masuk',s.ci],['Transaksi keluar',s.co]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="card"><b>Grafik pemasukan</b>${chart(r,['i'],['#12A150'])}</div><div class="card"><b>Grafik pengeluaran</b>${chart(r,['o'],['#D93636'])}</div>
<div class="card"><b>Perbandingan masuk dan keluar</b>${chart(r,['i','o'],['#12A150','#D93636'])}<div class="leg"><span><i style="background:#12A150"></i>Masuk</span><span><i style="background:#D93636"></i>Keluar</span></div></div><div class="card"><b>Statistik transaksi 12 bulan</b>${chart(r,['n'],['#2563FF'],1)}</div>
<div class="card">${[['Edit profil','user','edP()'],['Ubah PIN','lock','cpn()'],['Keamanan akun','lock',"go('info','sec')"],['Notifikasi','bell',"go('info','not')"],['Pusat bantuan','info',"go('info','help')"],['Syarat dan ketentuan','bill',"go('info','tnc')"],['Kebijakan privasi','lock',"go('info','prv')"],['Logout','out','logout()']].map(x=>`<div class="mn" onclick="${x[2]}"><div class="ti">${ic(x[1],18)}</div><span>${x[0]}</span></div>`).join('')}</div></div>`};
function edP(){const a=me();modal(`<h2>Edit profil</h2><label>Nama lengkap<input id="en" value="${esc(a.name)}" maxlength="40"></label><label>Nomor HP<input id="ep" value="${a.phone}" inputmode="tel" maxlength="16"></label><label>PIN<input id="pin" type="password" inputmode="numeric" maxlength="6"></label><div class="err" id="pe"></div><div class="two"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn" onclick="svP()">Simpan</button></div>`)}
function svP(){const a=me(),n=$('#en').value.trim().replace(/\s+/g,' '),p=ph($('#ep').value),e=m=>{$('#pe').textContent=m};
if(!NM.test(n))return e('Nama 3–40 huruf, tanpa angka.');if(!p)return e('Nomor HP tidak valid.');if(p!=a.phone&&DB.accounts[p])return e('Nomor sudah dipakai akun lain.');if(hs($('#pin').value,a.id)!=a.pin)return e('PIN salah.');
a.name=n;if(p!=a.phone){delete DB.accounts[a.phone];a.phone=p;DB.accounts[p]=a;DB.session=p}save();closeM();toast('Profil diperbarui');go('account')}
function cpn(){modal(`<h2>Ubah PIN</h2><label>PIN lama<input id="o1" type="password" inputmode="numeric" maxlength="6"></label><label>PIN baru (6 angka)<input id="o2" type="password" inputmode="numeric" maxlength="6"></label><label>Ulangi PIN baru<input id="o3" type="password" inputmode="numeric" maxlength="6"></label><div class="err" id="pe"></div><div class="two"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn" onclick="svN()">Simpan</button></div>`)}
function svN(){const a=me(),e=m=>{$('#pe').textContent=m},n=$('#o2').value;if(hs($('#o1').value,a.id)!=a.pin)return e('PIN lama salah.');if(!/^\d{6}$/.test(n))return e('PIN baru harus 6 angka.');if(n!=$('#o3').value)return e('Konfirmasi PIN tidak sama.');a.pin=hs(n,a.id);save();closeM();toast('PIN diperbarui')}
go(DB.session&&me()?'home':'auth');
</script></body></html>
