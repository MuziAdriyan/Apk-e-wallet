<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuziPay</title>
<style>
:root{--b:#1565ff;--b2:#0a3fd0;--bg:#f1f5ff;--tx:#0f1e3d;--mu:#6b7a99;--ok:#12b76a;--wa:#f79009;--er:#f04438;--ln:#e0e8f8}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:15px}
button{cursor:pointer;border:0;background:none;color:inherit}
#app{display:flex;min-height:100vh}
.side{display:none;width:236px;background:#fff;border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;flex-direction:column;gap:4px}
.side .logo{margin:0 8px 18px}
.nb{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:var(--mu);font-weight:600;width:100%;text-align:left}
.nb.on{background:#e8f0ff;color:var(--b)}
.main{flex:1;min-width:0;max-width:860px;margin:0 auto;width:100%;padding:14px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--b2)}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4d9bff,#0a3fd0);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.sim{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#dcfae6;color:#067647}
.sim.off{background:#fef0c7;color:#93370d}
.ib{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;border:1px solid var(--ln)}
.ib b{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.bot .nb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center}
@media(min-width:900px){.side{display:flex}.bot{display:none}.main{padding-bottom:40px}}
.ph{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.ph h2{font-size:20px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
.bal{background:linear-gradient(135deg,#2f80ff 0%,#0a3fd0 60%,#08297f 100%);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 14px 30px -12px rgba(10,63,208,.6)}
.bal:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.bal .row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.av{width:44px;height:44px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.amt{font-size:30px;font-weight:800;margin:14px 0 2px;display:flex;align-items:center;gap:10px}
.amt button{color:#fff;opacity:.85}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.acts button{background:#ffffff26;border-radius:14px;padding:10px 2px;font-size:12px;font-weight:600;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
.gi{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;text-align:center}
.ico{width:42px;height:42px;border-radius:14px;background:#e8f0ff;color:var(--b);display:grid;place-items:center}
.slw{overflow:hidden;border-radius:20px;margin-bottom:14px;position:relative}
.sl{display:flex;transition:transform .6s ease}
.slide{min-width:100%;padding:20px;color:#fff;min-height:130px;background:linear-gradient(120deg,#0a3fd0,#38a0ff);background-size:cover;background-position:center;cursor:pointer;position:relative}
.slide:nth-child(2n){background-image:linear-gradient(120deg,#082a85,#2f80ff)}
.slide h3{font-size:18px;margin:14px 0 4px;max-width:80%}.slide p{font-size:13px;opacity:.9;max-width:80%;margin-bottom:10px}
.ad{position:absolute;top:10px;right:10px;background:#0006;font-size:11px;padding:2px 8px;border-radius:6px}
.dots{display:flex;gap:5px;justify-content:center;margin:-22px 0 8px;position:relative}
.dots i{width:6px;height:6px;border-radius:9px;background:#fff8}.dots i.on{width:18px;background:#fff}
.btn{background:linear-gradient(135deg,#2f80ff,#0a3fd0);color:#fff;padding:13px 18px;border-radius:14px;font-weight:700;width:100%;display:block;text-align:center;font-size:15px}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ghost{background:#e8f0ff;color:var(--b2)}.btn.w{background:#fff;color:var(--b2)}.btn.red{background:var(--er)}
.btns{display:flex;gap:10px;margin-top:14px}
.f{display:block;margin-bottom:12px}.f span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--mu)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;font-size:15px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
input[type=checkbox]{width:auto;margin-right:8px}input[type=range]{padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:12px;padding:9px 13px;font-weight:600;font-size:13px;text-align:left}
.chip small{display:block;color:var(--mu);font-weight:500;margin-top:2px}
.chip.on{border-color:var(--b);background:#e8f0ff;color:var(--b2)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.li:last-child{border:0}.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--mu)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}
.success{background:#dcfae6;color:#067647}.pending{background:#fef0c7;color:#93370d}.failed{background:#fee4e2;color:#b42318}.none{background:#eaecf0;color:#475467}
.plus{color:var(--ok);font-weight:700}.minus{font-weight:700}
.note{background:#fff7e0;border:1px solid #fde4a3;color:#7a4b00;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:13px;line-height:1.5}
.mu{color:var(--mu);font-size:13px}
.mb{position:fixed;inset:0;background:#0b1b4399;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mb[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto;animation:up .25s}
@media(min-width:600px){.mb{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin-bottom:12px}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:14px}.rows span{color:var(--mu)}.rows b{text-align:right;word-break:break-word}
.rc{text-align:center;margin-bottom:10px}
.spin{width:46px;height:46px;border:5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin:auto}
#ld{align-items:center}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#0f1e3d;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;animation:up .25s;box-shadow:0 8px 20px #0004}
#toast .err{background:var(--er)}
.sk{height:90px;border-radius:18px;margin-bottom:14px;background:linear-gradient(90deg,#e3eafb 25%,#f3f6ff 50%,#e3eafb 75%);background-size:200%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.pv{border:2px dashed var(--ln);border-radius:14px;padding:10px;margin-bottom:12px;text-align:center}.pv img{max-width:100%;max-height:200px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--ln)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
details{padding:12px 0;border-bottom:1px solid var(--ln)}summary{font-weight:600;cursor:pointer}details p{margin-top:8px;color:var(--mu);line-height:1.5}
p.d{line-height:1.6;margin-bottom:10px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none}.sheet{max-height:none;box-shadow:none}.btns{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><aside class="side" id="side"></aside><main class="main"><div class="top" id="top"></div><div id="view"></div></main></div>
<nav class="bot" id="bot"></nav>
<div id="modal" class="mb" hidden></div><div id="ld" class="mb" hidden><div class="spin"></div></div><div id="toast"></div>
<div id="lock" class="mb" hidden style="align-items:center"><div class="sheet" style="border-radius:24px;text-align:center"><div class="logo" style="justify-content:center;margin-bottom:10px"><i>M</i>MuziPay</div><p class="mu" style="margin-bottom:12px">Anda telah keluar. Masukkan PIN untuk masuk kembali (PIN awal: 123456).</p><input id="lpin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 6 digit" style="text-align:center;margin-bottom:12px"><button class="btn" data-act="unlock">Masuk</button></div></div>
<script>
const I={home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',down:'<path d="M12 3v14M5 12l7 7 7-7"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',game:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M5 12.5h4M16 11h.01M18 14h.01"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',bill:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',file:'<path d="M14 2H6v20h12V6zM14 2v4h4M9 13h6M9 17h6"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M13 10h5M13 14h4"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',chev:'<path d="M9 6l6 6-6 6"/>',back:'<path d="M15 6l-6 6 6 6"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>'};
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;
const fd=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const v=id=>{const e=$('#'+id);return e?e.value.trim():''};
const K='muzipay.v1';
const DEF=()=>({sim:true,bal:500000,hide:false,locked:false,pin:'123456',outcome:'ok',push:true,kyc:{st:'none'},txs:[],loans:[],
user:{name:'Pengguna MuziPay',phone:'081234567890',email:'pengguna@email.com',acc:'8800 1234 5678'},
notifs:[{id:1,t:'Selamat datang di MuziPay',d:'Mode Simulasi aktif dengan saldo virtual Rp500.000.',ts:Date.now(),r:0}],
banners:[{t:'Top Up Game Lebih Hemat',d:'Diskon biaya admin untuk game favoritmu.',l:'#game',img:'',ad:1},{t:'Pulsa dan Paket Data',d:'Isi ulang semua operator dalam hitungan detik.',l:'#pulsa',img:'',ad:1},{t:'Bayar Tagihan Tanpa Antre',d:'PLN, BPJS, PDAM, dan WiFi dalam satu aplikasi.',l:'#tagihan',img:'',ad:0},{t:'Hitung Cicilan Sebelum Memutuskan',d:'Coba kalkulator pinjaman simulasi.',l:'#pinjaman',img:'',ad:0}]});
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&typeof d==='object')return Object.assign(DEF(),d)}catch(e){}return DEF()}
let S=load();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
// Titik integrasi layanan iklan resmi: ganti AdProvider.get dengan SDK/API penyedia iklan.
const AdProvider={get:()=>S.banners};
let cur='home',HIST=[],SEL={},F='all',PH={id:null,selfie:null},AV=null,LN={a:2000000,n:6},bi=0;
const SC={success:'Berhasil',pending:'Pending',failed:'Gagal'},TL={topup:'Top Up',transfer:'Transfer',tarik:'Tarik Saldo',game:'Pembelian Game',pulsa:'Pulsa & Data',tagihan:'Bayar Tagihan'},TI={topup:'plus',transfer:'send',tarik:'down',game:'game',pulsa:'phone',tagihan:'bill'};
const NAV=[['home','home','Beranda'],['layanan','grid','Layanan'],['riwayat','clock','Riwayat'],['promo','tag','Promo'],['akun','user','Akun']];
const AKUN=['akun','profil','settings','keamanan','notif','bantuan','faq','tnc','privasi','info','cs'];
const toast=(m,e)=>{const d=document.createElement('div');d.textContent=m;if(e)d.className='err';$('#toast').append(d);setTimeout(()=>d.remove(),3000)};
const loader=b=>$('#ld').hidden=!b;
const modal=h=>{const m=$('#modal');m.innerHTML=`<div class="sheet">${h}</div>`;m.hidden=false};
const closeM=()=>{$('#modal').hidden=true};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
const rows=a=>`<div class="rows">${a.map(([k,x])=>`<div><span>${k}</span><b>${esc(x)}</b></div>`).join('')}</div>`;
const fld=(id,l,ph='',t='text',x='')=>`<label class="f"><span>${l}</span><input id="${id}" type="${t}" placeholder="${ph}" ${x}></label>`;
const sel=(id,l,o)=>`<label class="f"><span>${l}</span><select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const chips=(n,a,s)=>`<div class="chips" data-n="${n}">${a.map(([l,x,sm])=>`<button type="button" class="chip${String(x)===String(s)?' on':''}" data-v="${x}">${l}${sm?`<small>${sm}</small>`:''}</button>`).join('')}</div>`;
const head=(t,b=true)=>`<div class="ph">${b?`<button class="ib" data-act="back" aria-label="Kembali">${ic('back')}</button>`:''}<h2>${t}</h2></div>`;
const grid=a=>`<div class="grid">${a.map(([p,i,l])=>`<button class="gi" data-go="${p}"><span class="ico">${ic(i)}</span>${l}</button>`).join('')}</div>`;
const badge=s=>`<span class="badge ${s}">${SC[s]||s}</span>`;
const txli=t=>`<button class="li" data-act="detail" data-id="${t.id}"><span class="ico">${ic(TI[t.type])}</span><span class="t"><b>${esc(t.label)}</b><small>${fd(t.ts)}</small></span><span style="text-align:right"><div class="${t.type==='topup'?'plus':'minus'}">${t.type==='topup'?'+':'-'}${rp(t.type==='topup'?t.amt:t.tot)}</div>${badge(t.st)}</span></button>`;
const empty=m=>`<p class="mu" style="padding:18px 0;text-align:center">${m}</p>`;
const unread=()=>S.notifs.filter(n=>!n.r).length;
const doc=(t,a)=>head(t)+`<div class="card">${a.map(x=>`<p class="d">${x}</p>`).join('')}</div>`;

// ---------- Halaman ----------
const P={};
P.home=()=>`<div class="card bal"><div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="av">${AV?`<img src="${AV}" alt="">`:esc(S.user.name[0])}</div><div><small style="opacity:.8">Selamat datang,</small><div style="font-weight:700">${esc(S.user.name)}</div></div></div><span class="badge ${S.kyc.st==='verified'?'success':'none'}">${S.kyc.st==='verified'?'Terverifikasi':'Belum Terverifikasi'}</span></div>
<div class="amt"><span>${S.hide?'Rp ••••••':rp(S.bal)}</span><button data-act="toggleBal" aria-label="Tampilkan atau sembunyikan saldo">${ic('eye',20)}</button></div><div style="font-size:13px;opacity:.85">Akun ${esc(S.user.acc)}</div>
<div class="acts"><button data-go="topup">${ic('plus')}Top Up</button><button data-go="transfer">${ic('send')}Transfer</button><button data-go="tarik">${ic('down')}Tarik</button><button data-go="riwayat">${ic('clock')}Riwayat</button></div></div>
${slider()}${grid([['game','game','Top Up Game'],['pulsa','phone','Pulsa & Data'],['tagihan','bill','Tagihan'],['pinjaman','cash','Pinjaman'],['kyc','id','Verifikasi'],['promo','tag','Promo'],['notif','bell','Notifikasi'],['layanan','grid','Semua']])}
<div class="card" style="margin-top:14px"><b>Notifikasi terbaru</b>${S.notifs.slice(0,2).map(n=>`<div class="li"><span class="ico">${ic('bell')}</span><span class="t"><b>${esc(n.t)}</b><small>${esc(n.d)}</small></span></div>`).join('')||empty('Belum ada notifikasi')}</div>
<div class="card"><b>Promo dan penawaran</b><p class="mu" style="margin:6px 0 10px">Lihat semua penawaran terbaru untuk layananmu.</p><button class="btn ghost" data-go="promo">Lihat Promo</button></div>
<div class="card"><b>Transaksi terakhir</b>${S.txs.slice(0,3).map(txli).join('')||empty('Belum ada transaksi. Coba top up saldo virtual.')}</div>`;
const slider=()=>{const b=AdProvider.get();return `<div class="slw"><div class="sl" id="sl">${b.map(x=>`<div class="slide" data-act="blink" data-l="${esc(x.l)}" ${x.img?`style="background-image:linear-gradient(90deg,rgba(8,41,127,.85),rgba(8,41,127,.2)),url('${esc(x.img)}')"`:''}>${x.ad?'<span class="ad">Iklan</span>':''}<h3>${esc(x.t)}</h3><p>${esc(x.d)}</p><span class="btn sm w">Lihat Promo</span></div>`).join('')}</div></div><div class="dots">${b.map((_,i)=>`<i class="${i===bi?'on':''}"></i>`).join('')}</div>`};
P.layanan=()=>head('Layanan',false)+grid([['topup','plus','Top Up'],['transfer','send','Transfer'],['tarik','down','Tarik Saldo'],['game','game','Top Up Game'],['pulsa','phone','Pulsa & Data'],['tagihan','bill','Bayar Tagihan'],['pinjaman','cash','Pinjaman'],['kyc','id','Verifikasi KYC']]);
const METH=['Transfer Bank BCA','Transfer Bank Mandiri','Transfer Bank BNI','QRIS','Minimarket'];

function review(o){if(!S.sim)return toast('Aktifkan Mode Simulasi untuk mencoba transaksi','err');
if(!o.credit&&S.bal<o.amt+o.fee)return toast('Saldo tidak mencukupi. Top up terlebih dahulu.','err');
modal(`<h3>Konfirmasi Transaksi</h3>${rows([['Jenis',o.label],['Tujuan',o.detail],['Nominal',rp(o.amt)],['Biaya admin',rp(o.fee)],['Total',rp(o.amt+o.fee)],['Metode',o.method]])}<div class="btns"><button class="btn ghost" data-act="closeM">Batal</button><button class="btn" id="goPin">Lanjut</button></div>`);$('#goPin').onclick=()=>askPin(()=>exec(o))}

let seq=0;
function exec(o){closeM();loader(true);setTimeout(()=>{loader(false);const tot=o.amt+o.fee;
if(!o.credit&&S.bal<tot)return toast('Saldo tidak mencukupi','err');
const r=Math.random(),st=S.outcome==='rand'?(r<.75?'success':r<.9?'pending':'failed'):'success';
if(st!=='failed')S.bal+=o.credit?o.amt:-tot;
const t={id:'MZP'+Date.now().toString(36).toUpperCase()+(++seq).toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),ts:Date.now(),type:o.type,label:o.label,detail:o.detail,amt:o.amt,fee:o.fee,tot,st,method:o.method};
S.txs.unshift(t);if(S.push)S.notifs.unshift({id:Date.now(),t:`${o.label} ${SC[st].toLowerCase()}`,d:`${rp(tot)} • ${t.id}`,ts:Date.now(),r:0});
save();render();rc(t.id,1)},900)}
const tx=id=>S.txs.find(t=>t.id===id);
function rc(id,proof){const t=tx(id);if(!t)return;modal(`${proof?`<div class="rc"><div class="logo" style="justify-content:center"><i>M</i>MuziPay</div><b>Bukti Transaksi</b><div style="margin-top:6px">${badge(t.st)}</div></div>`:'<h3>Detail Transaksi</h3>'}${rows([['ID transaksi',t.id],['Waktu',fd(t.ts)],['Jenis',TL[t.type]],['Keterangan',t.label],['Tujuan',t.detail],['Nominal',rp(t.amt)],['Biaya admin',rp(t.fee)],['Total pembayaran',rp(t.tot)],['Metode',t.method],['Status',SC[t.st]]])}<p class="mu" style="margin-top:10px;text-align:center">Transaksi simulasi dengan saldo virtual.</p><div class="btns">${proof?'':`<button class="btn ghost sm" data-act="proof" data-id="${id}">Lihat Bukti</button>`}<button class="btn ghost sm" data-act="print">Cetak</button><button class="btn ghost sm" data-act="saveTxt" data-id="${id}">Simpan</button><button class="btn sm" data-act="closeM">Tutup</button></div>`)}
function settle(){let ch=0;const n=Date.now();S.txs.forEach(t=>{if(t.st==='pending'&&n-t.ts>6000){t.st='success';ch=1}});S.loans.forEach(l=>{if(l.st==='Menunggu'&&n-l.ts>5000){l.st='Disetujui (simulasi)';ch=1}});if(S.kyc.st==='pending'&&n-S.kyc.ts>6000){S.kyc.st='verified';ch=1}
if(ch){save();const a=document.activeElement;if(!(a&&a.matches('input,select,textarea')))render()}}
setInterval(settle,2000);
const num=(s,a,b)=>/^\d+$/.test(s)&&+s>=a&&+s<=b;
const amtOf=(sk,ck)=>v(ck)?+v(ck):+(SEL[sk]||0);
const bad=m=>{toast(m,'err');return 0};
const detectOp=n=>Object.keys(OPS).find(o=>OPS[o].includes(n.slice(0,4)));

// ---------- Aksi ----------
const ACT={
back(){const p=HIST.pop()||'home';go(p,1)},closeM,print(){window.print()},
toggleBal(){S.hide=!S.hide;save();render()},
toggleSim(e){S.sim=e.checked;save();render();toast(S.sim?'Mode Simulasi diaktifkan':'Mode Simulasi dinonaktifkan')},
togglePush(e){S.push=e.checked;save()},setOutcome(e){S.outcome=e.value;save()},
blink(e){const l=e.dataset.l||'';if(l[0]==='#')go(l.slice(1));else if(/^https?:\/\//i.test(l))window.open(l,'_blank','noopener');else toast('Tautan promo belum diatur','err')},
detail(e){rc(e.dataset.id)},proof(e){rc(e.dataset.id,1)},
saveTxt(e){const t=tx(e.dataset.id);if(!t)return;const s=`MuziPay - Bukti Transaksi\nID: ${t.id}\nWaktu: ${fd(t.ts)}\nJenis: ${TL[t.type]}\nKeterangan: ${t.label}\nTujuan: ${t.detail}\nNominal: ${rp(t.amt)}\nBiaya admin: ${rp(t.fee)}\nTotal: ${rp(t.tot)}\nMetode: ${t.method}\nStatus: ${SC[t.st]}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain'}));a.download=t.id+'.txt';a.click();URL.revokeObjectURL(a.href)},
doTopup(){const a=amtOf('amt','ca');if(!(a>=10000&&a<=10000000))return bad('Nominal top up Rp10.000 - Rp10.000.000');review({type:'topup',label:'Top Up Saldo',detail:'Saldo MuziPay',amt:a,fee:1000,method:v('mt'),credit:1})},
doGame(){const gi=SEL.game;if(gi==null)return bad('Pilih game terlebih dahulu');const g=GAMES[gi],u=v('uid'),z=v('zid');if(!num(u,5,15))return bad('User ID harus 5 - 15 digit');if(g[2]&&!num(z,2,6))return bad('Zone ID harus 2 - 6 digit');if(SEL.gi==null)return bad('Pilih nominal');const q=g[4][SEL.gi];review({type:'game',label:'Top Up '+g[0],detail:`ID ${u}${g[2]?' ('+z+')':''} • ${q} ${g[1]}`,amt:gp(g,q),fee:1000,method:'Saldo MuziPay'})},
doPulsa(){const n=v('hp');if(!/^08\d{8,12}$/.test(n))return bad('Nomor HP tidak valid (08xxxxxxxxxx)');if(SEL.pi==null)return bad('Pilih nominal atau paket');const d=SEL.pt==='data',p=d?PD[SEL.pi]:null,a=d?p[1]:+SEL.pi+1500;review({type:'pulsa',label:`${d?'Paket Data':'Pulsa'} ${SEL.op}`,detail:`${n} • ${d?p[0]:rp(+SEL.pi)}`,amt:a,fee:500,method:'Saldo MuziPay'})},
doTagihan(){if(!SEL.bl)return bad('Pilih jenis tagihan');const c=v('cn');if(!num(c,100000,9999999999999999))return bad('Nomor pelanggan 6 - 16 digit');const a=amtOf('bn','bm');if(!(a>=10000&&a<=5000000))return bad('Nominal Rp10.000 - Rp5.000.000');review({type:'tagihan',label:SEL.bl,detail:'No. '+c,amt:a,fee:2500,method:'Saldo MuziPay'})},
doTransfer(){const n=v('tn'),a=+v('ta');if(!/^08\d{8,12}$/.test(n))return bad('Nomor tujuan tidak valid');if(n===S.user.phone)return bad('Tidak bisa transfer ke nomor sendiri');if(!(a>=10000&&a<=20000000))return bad('Nominal Rp10.000 - Rp20.000.000');review({type:'transfer',label:'Transfer ke '+n,detail:n+(v('tc')?' • '+v('tc'):''),amt:a,fee:500,method:'Saldo MuziPay'})},
doTarik(){const r=v('tr'),a=+v('tt');if(!num(r,1000000000,9999999999999999))return bad('Nomor rekening 10 - 16 digit');if(!(a>=50000&&a<=10000000))return bad('Nominal Rp50.000 - Rp10.000.000');review({type:'tarik',label:'Tarik Saldo ke '+v('tb'),detail:`${v('tb')} ${r}`,amt:a,fee:6500,method:'Saldo MuziPay'})},
loanSubmit(){if(!S.sim)return bad('Aktifkan Mode Simulasi untuk mengajukan');const c=lcalc();S.loans.unshift({a:LN.a,n:LN.n,c,ts:Date.now(),st:'Menunggu'});save();render();toast('Pengajuan simulasi terkirim')},
kycSubmit(){const n=v('kn'),k=v('kk');if(n.length<3)return bad('Nama lengkap wajib diisi');if(!/^\d{16}$/.test(k))return bad('NIK harus 16 digit');if(!v('kt')||!v('kd')||v('ka').length<8)return bad('Lengkapi tempat, tanggal lahir, dan alamat');if(!/^08\d{8,12}$/.test(v('kp')))return bad('Nomor telepon tidak valid');if(!/^\S+@\S+\.\S+$/.test(v('ke')))return bad('Email tidak valid');if(!PH.id||!PH.selfie)return bad('Unggah foto identitas dan selfie');if(!$('#kc').checked)return bad('Setujui formulir privasi');S.kyc={st:'pending',ts:Date.now(),data:{name:n,nik:'************'+k.slice(-4)}};save();render();toast('Data dikirim untuk simulasi verifikasi')},
chg(e){$('#fi-'+e.dataset.k).click()},
delph(e){confirmBox('Hapus foto ini?',()=>{PH[e.dataset.k]=null;const i=$('#fi-'+e.dataset.k);if(i)i.value='';prev(e.dataset.k)})},
readAll(){S.notifs.forEach(n=>n.r=1);save();render()},
clearNotif(){confirmBox('Hapus semua notifikasi?',()=>{S.notifs=[];save();render()})},
saveProfile(){const n=v('pn'),p=v('pp'),e=v('pe');if(n.length<3)return bad('Nama minimal 3 karakter');if(!/^08\d{8,12}$/.test(p))return bad('Nomor telepon tidak valid');if(!/^\S+@\S+\.\S+$/.test(e))return bad('Email tidak valid');Object.assign(S.user,{name:n,phone:p,email:e});save();render();toast('Profil disimpan')},
savePin(){if(v('po')!==S.pin)return bad('PIN lama salah');if(!/^\d{6}$/.test(v('pb')))return bad('PIN baru harus 6 digit angka');if(v('pb')!==v('pu'))return bad('Konfirmasi PIN tidak sama');S.pin=v('pb');save();render();toast('PIN berhasil diubah')},
savePass(){const n=v('wn');if(!v('wo'))return bad('Isi password lama');if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(n))return bad('Password minimal 8 karakter dengan huruf dan angka');if(n!==v('wu'))return bad('Konfirmasi password tidak sama');render();toast('Password diperbarui (tidak disimpan oleh aplikasi)')},
csSend(){if(v('cm').length<10)return bad('Pesan minimal 10 karakter');const id='CS'+Date.now().toString(36).toUpperCase();S.notifs.unshift({id:Date.now(),t:'Pesan ke customer service terkirim',d:'Nomor tiket '+id,ts:Date.now(),r:0});save();render();toast('Terkirim. Tiket '+id)},
resetAll(){confirmBox('Reset seluruh data simulasi? Saldo, transaksi, dan pengaturan akan kembali ke awal.',()=>{S=DEF();save();AV=null;PH={id:null,selfie:null};render();toast('Data simulasi direset')})},
logout(){confirmBox('Keluar dari akun?',()=>{S.locked=true;save();$('#lock').hidden=false})},
unlock(){if($('#lpin').value===S.pin){S.locked=false;save();$('#lock').hidden=true;$('#lpin').value=''}else toast('PIN salah','err')},
bSave(e){const i=+e.dataset.i,l=v('bl'+i);if(!v('bt'+i))return bad('Judul wajib diisi');if(l&&!/^(#[a-z]+|https?:\/\/\S+)$/i.test(l))return bad('Tautan harus #halaman atau https://');const g=v('bg'+i);if(g&&!/^https?:\/\//i.test(g))return bad('URL gambar harus diawali https://');S.banners[i]={t:v('bt'+i),d:v('bd'+i),l,img:g,ad:$('#ba'+i).checked?1:0};save();render();toast('Banner disimpan')},
bDel(e){confirmBox('Hapus banner ini?',()=>{S.banners.splice(+e.dataset.i,1);bi=0;save();render()})},
bAdd(){S.banners.push({t:'Banner Baru',d:'Ubah teks promo di sini.',l:'#promo',img:'',ad:1});save();render()}};
function confirmBox(m,yes){modal(`<h3>Konfirmasi</h3><p class="d">${m}</p><div class="btns"><button class="btn ghost" data-act="closeM">Batal</button><button class="btn red" id="yes">Ya, lanjutkan</button></div>`);$('#yes').onclick=()=>{closeM();yes()}}
function prev(k){const b=$('#pv-'+k);if(!b)return;b.innerHTML=PH[k]?`<img src="${PH[k]}" alt="Pratinjau"><div class="btns" style="justify-content:center"><button class="btn sm" data-act="chg" data-k="${k}">Ganti</button><button class="btn sm ghost" data-act="delph" data-k="${k}">Hapus</button></div>`:'<p class="mu">Belum ada foto</p>'}
function pick(i,k){const f=i.files[0];if(!f)return;if(!/^image\/(jpe?g|png|webp)$/.test(f.type)||f.size>5e6){i.value='';return toast('Gunakan JPG, PNG, atau WebP maksimal 5 MB','err')}const r=new FileReader();r.onload=()=>{if(k==='avatar'){AV=r.result;render()}else{PH[k]=r.result;prev(k)}};r.readAsDataURL(f)}

// ---------- Event ----------
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){const w=c.closest('.chips');$$('.chip',w).forEach(x=>x.classList.remove('on'));c.classList.add('on');const n=w.dataset.n;SEL[n]=n==='game'||n==='gi'||n==='pi'||n==='op'||n==='pt'||n==='bl'||n==='bn'||n==='amt'?(isNaN(c.dataset.v)||n==='op'||n==='pt'||n==='bl'?c.dataset.v:+c.dataset.v):c.dataset.v;if(CH[n])CH[n](n==='tenor'||n==='game'?+c.dataset.v:c.dataset.v);return}
const a=e.target.closest('[data-act],[data-go]');if(!a)return;if(a.dataset.go){go(a.dataset.go);return}if(a.tagName==='INPUT'||a.tagName==='SELECT')return;const f=ACT[a.dataset.act];if(f)f(a,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pick)pick(t,t.dataset.pick);else if(t.tagName==='INPUT'&&t.dataset.act==='toggleSim'||t.tagName==='INPUT'&&t.dataset.act==='togglePush'||t.tagName==='SELECT'&&t.dataset.act)ACT[t.dataset.act](t)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='lr'){LN.a=+t.value;lcalc()}else if(t.id==='hp'){const o=detectOp(t.value);if(o){SEL.op=o;$$('[data-n=op] .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===o))}}else if(t.id==='ca'||t.id==='bm'){$$('.chips[data-n=amt] .chip,.chips[data-n=bn] .chip').forEach(c=>c.classList.remove('on'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.id==='lpin')ACT.unlock()});
if(S.locked)$('#lock').hidden=false;
go('home');
</script></body></html>
